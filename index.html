<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Espejo navideño — RK Quinta Avenida</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0d1b2a;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    width: min(90vh, 96vw);
    aspect-ratio: 562 / 1000;
    max-height: 96vh;
    border-radius: 14px;
    overflow: hidden;
    background: #050a12;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  canvas#fx {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #msg {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%) translateY(12px);
    width: 78%;
    text-align: center;
    color: #FBF6EA;
    font-size: clamp(15px, 3.1vw, 21px);
    line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    opacity: 0;
    transition: opacity 1.1s ease, transform 1.1s ease;
    pointer-events: none;
    z-index: 7;
  }
  #msg.show { opacity: 1; transform: translate(-50%, -50%) translateY(0); }

  /* idle invitation image, covers the whole frame until a face is close */
  #idleImg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 9;
    transition: opacity 0.9s ease;
    pointer-events: none;
  }
  #idleImg.hidden { opacity: 0; }

  #startGate {
    position: absolute; inset: 0;
    z-index: 20;
    background: rgba(7,16,24,0.92);
    color: #F4E9C9;
    border: none;
    font-family: inherit;
    font-size: clamp(18px, 3vw, 24px);
    cursor: pointer;
    display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
  }
  #startGate small {
    font-size: 14px; opacity: 0.7; max-width: 70%; text-align: center;
    letter-spacing: 0.3px;
  }
  #startGate .pill {
    padding: 12px 28px;
    border: 1.5px solid #C9A44C;
    border-radius: 999px;
    background: rgba(201,164,76,0.12);
  }
  #debug {
    position: absolute;
    top: 4px; left: 4px;
    font-family: monospace;
    font-size: 11px;
    color: #9fe1cb;
    background: rgba(0,0,0,0.5);
    padding: 3px 6px;
    z-index: 30;
    pointer-events: none;
    white-space: pre;
  }
</style>
</head>

const video = document.getElementById('video');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
const startGate = document.getElementById('startGate');
const idleImg = document.getElementById('idleImg');
const debugEl = document.getElementById('debug');

function setDebug(text) {
  if (SHOW_DEBUG) debugEl.textContent = text;
}

const QUOTES = [
  "Nada ocurre por casualidad. Ni siquiera esto.",
  "A veces lo más bonito no es lo que buscas. Es lo que te encuentra.",
  "Que este año te encuentre en paz.",
  "No tienes que tenerlo todo resuelto para merecer una Navidad tranquila.",
  "Lo que es para ti, será para ti, aunque te alejes.",
  "Que lo pequeño te siga pareciendo grande.",
  "Hay quien hace hogar. Ojalá tengas de esa gente cerca.",
  "Feliz Navidad, de parte de todo el equipo de RK Quinta Avenida."
];
let quoteIndex = 0;

// ---------- images loaded once, drawn every frame from canvas ----------
const hatImg = new Image();
let hatReady = false;
hatImg.onload = () => { hatReady = true; };
hatImg.onerror = () => { setDebug('ERROR cargando gorro'); };
hatImg.src = HAT_SRC;

const frameImg = new Image();
let frameReady = false;
frameImg.onload = () => { frameReady = true; };
frameImg.onerror = () => { setDebug('ERROR cargando marco'); };
frameImg.src = FRAME_SRC;

// ---------- canvas sizing ----------
function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

// ---------- snow ----------
let flakes = [];
function initSnow() {
  flakes = [];
  const count = Math.floor((canvas.width * canvas.height) / 3500) || 120;
  for (let i = 0; i < count; i++) {
    flakes.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 4 + 2,
      speed: Math.random() * 1.3 + 0.6,
      drift: Math.random() * 0.8 - 0.4,
      alpha: Math.random() * 0.4 + 0.6
    });
  }
}
function drawSnow() {
  for (const f of flakes) {
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,' + f.alpha + ')';
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
    f.y += f.speed;
    f.x += f.drift;
    if (f.y > canvas.height) { f.y = -6; f.x = Math.random() * canvas.width; }
  }
}

// ---------- santa hat, cropped tight to its own artwork ----------
const HAT_ASPECT = 600 / 510;

function drawHat(box) {
  if (!hatReady) return;
  const w = box.width * 0.95;
  const h = w / HAT_ASPECT;
  const cx = box.x + box.width / 2;
  const topY = box.y - h * 0.8;
  ctx.drawImage(hatImg, cx - w / 2, topY, w, h);
}

// ---------- frame overlay ----------
function drawFrame() {
  if (!frameReady) return;
  ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
}

// ---------- shared state ----------
let currentFaceBoxes = [];  // array of {x,y,width,height}
let isClose = false;
let hasGreetedThisVisit = false;
let awayFrames = 0;
const CLOSE_WIDTH_RATIO = 0.14;

// ---------- render loop ----------
function startRenderLoop() {
  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSnow();

    for (const box of currentFaceBoxes) {
      drawHat(box);
    }

    drawFrame();

    if (isClose) {
      awayFrames = 0;
      if (!idleImg.classList.contains('hidden')) idleImg.classList.add('hidden');
    } else {
      awayFrames++;
      if (awayFrames > 150) {
        idleImg.classList.remove('hidden');
      }
    }

    requestAnimationFrame(frame);
  }
  frame();
}

// ---------- detection loop: detects ALL faces, so two people both get a hat ----------
async function startDetectionLoop() {
  try {
    setDebug('Cargando modelo facial…');
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    setDebug('Modelo cargado. Detectando…');
  } catch (err) {
    setDebug('No se pudo cargar el modelo facial: ' + err.message);
    return;
  }

  const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });

  async function tick() {
    try {
      const results = await faceapi.detectAllFaces(video, options);
      const vw = video.videoWidth || canvas.width;
      const vh = video.videoHeight || canvas.height;
      const scaleX = canvas.width / vw;
      const scaleY = canvas.height / vh;

      const boxes = results.map(r => {
        const b = r.box;
        const mirroredX = canvas.width - (b.x + b.width) * scaleX;
        return {
          x: mirroredX,
          y: b.y * scaleY,
          width: b.width * scaleX,
          height: b.height * scaleY
        };
      });

      currentFaceBoxes = boxes;
      isClose = boxes.some(b => (b.width / canvas.width) > CLOSE_WIDTH_RATIO);
      setDebug(boxes.length + ' cara(s) detectada(s)' + (isClose ? ' · cerca' : ''));
    } catch (err) {
      setDebug('Error detectando: ' + err.message);
    }
    setTimeout(tick, 150);
  }
  tick();
}

// ---------- camera activation ----------
async function activateMirror() {
  try {
    setDebug('Pidiendo permiso de cámara…');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    startGate.style.display = 'none';

    await video.play();
    resizeCanvas();
    initSnow();

    startRenderLoop();
    startDetectionLoop();
  } catch (err) {
    startGate.style.display = 'flex';
    startGate.querySelector('small').textContent =
      'No se pudo acceder a la cámara: ' + err.message;
    setDebug('Error de cámara: ' + err.message);
  }
}

window.addEventListener('load', () => {
  activateMirror();
});
startGate.addEventListener('click', activateMirror);
</script>
