<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Espejo navideño — RK Quinta Avenida</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0d1b2a;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    width: min(90vh, 96vw);
    aspect-ratio: 562 / 1000;
    max-height: 96vh;
    border-radius: 14px;
    overflow: hidden;
    background: #050a12;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  canvas#fx {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #msg {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%) translateY(12px);
    width: 78%;
    text-align: center;
    color: #FBF6EA;
    font-size: clamp(15px, 3.1vw, 21px);
    line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    opacity: 0;
    transition: opacity 1.1s ease, transform 1.1s ease;
    pointer-events: none;
    z-index: 7;
  }
  #msg.show { opacity: 1; transform: translate(-50%, -50%) translateY(0); }

  /* idle invitation image, covers the whole frame until a face is close */
  #idleImg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 9;
    transition: opacity 0.9s ease;
    pointer-events: none;
  }
  #idleImg.hidden { opacity: 0; }

  #startGate {
    position: absolute; inset: 0;
    z-index: 20;
    background: rgba(7,16,24,0.92);
    color: #F4E9C9;
    border: none;
    font-family: inherit;
    font-size: clamp(18px, 3vw, 24px);
    cursor: pointer;
    display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
  }
  #startGate small {
    font-size: 14px; opacity: 0.7; max-width: 70%; text-align: center;
    letter-spacing: 0.3px;
  }
  #startGate .pill {
    padding: 12px 28px;
    border: 1.5px solid #C9A44C;
    border-radius: 999px;
    background: rgba(201,164,76,0.12);
  }
  #countdown {
    position: absolute; inset: 0;
    z-index: 12;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    color: #FBF6EA;
    font-weight: bold;
    text-shadow: 0 4px 24px rgba(0,0,0,0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #countdown.show { opacity: 1; }
  #countdown .big { font-size: clamp(90px, 22vh, 220px); line-height: 1; }
  #countdown .txt { font-size: clamp(36px, 8vh, 80px); }
  #flash {
    position: absolute; inset: 0;
    background: #fff;
    z-index: 15;
    opacity: 0;
    pointer-events: none;
  }
  #flash.go { animation: flashAnim 0.5s ease-out; }
  @keyframes flashAnim { 0% { opacity: 0.95; } 100% { opacity: 0; } }
  #shot {
    position: absolute;
    right: 5%; bottom: 5%;
    width: 38%;
    z-index: 13;
    border-radius: 3px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transform: rotate(3deg) scale(0.6);
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }
  #shot.show { opacity: 1; transform: rotate(3deg) scale(1); }
  #share {
    position: absolute;
    left: 50%; bottom: 5%;
    transform: translateX(-50%) translateY(16px);
    width: 76%;
    padding: 5% 5% 4%;
    background: rgba(251,246,234,0.97);
    color: #0d1b2a;
    border-radius: 20px;
    border: 2px solid #C9A44C;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    text-align: center;
    z-index: 14;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  #share.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #share .shareTitle { font-size: clamp(20px, 4.2vh, 36px); font-weight: bold; margin-bottom: 3%; }
  #share .shareBox {
    position: relative;
    width: 62%; aspect-ratio: 1; margin: 0 auto 3%;
    background: #fff; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  #share canvas { width: 100%; height: 100%; border-radius: 12px; display: none; }
  #share .shareSpin {
    width: 44px; height: 44px; border-radius: 50%;
    border: 5px solid #e6d9b5; border-top-color: #C9A44C;
    animation: spin 0.9s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #share[data-state="loading"] .shareSpin { display: block; }
  #share[data-state="ready"] canvas { display: block; }
  #shareMsg { font-size: clamp(14px, 2.5vh, 22px); margin-bottom: 2%; }
  #share .shareNote { font-size: clamp(10px, 1.7vh, 14px); opacity: 0.7; line-height: 1.35; }
  #debug {
    position: absolute;
    top: 4px; left: 4px;
    font-family: monospace;
    font-size: 11px;
    color: #9fe1cb;
    background: rgba(0,0,0,0.5);
    padding: 3px 6px;
    z-index: 30;
    pointer-events: none;
    white-space: pre;
  }
</style>
</head>

// ---------- images loaded once, drawn every frame from canvas ----------
const hatImg = new Image();
let hatReady = false;
let hatGreen = null;
hatImg.onload = () => {
  hatReady = true;
  try {
    // green hat: swap red/green channels of the red hat, darken to a forest green; white trim untouched
    const c = document.createElement('canvas');
    c.width = hatImg.naturalWidth; c.height = hatImg.naturalHeight;
    const x = c.getContext('2d');
    x.drawImage(hatImg, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height);
    const a = d.data;
    for (let i = 0; i < a.length; i += 4) {
      const r = a[i], g = a[i + 1], b = a[i + 2];
      if (r - g > 25) { a[i] = g * 0.9; a[i + 1] = r * 0.62; a[i + 2] = b * 0.8; }
    }
    x.putImageData(d, 0, 0);
    hatGreen = c;
  } catch (e) { hatGreen = null; }
};
hatImg.onerror = () => { setDebug('ERROR cargando gorro'); };
hatImg.src = HAT_SRC;

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

let flakes = [];
function initSnow() {
  flakes = [];
  const count = Math.floor((canvas.width * canvas.height) / 9000) || 60;
  for (let i = 0; i < count; i++) {
    const near = Math.random() < 0.18;
    flakes.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: near ? Math.random() * 3 + 5 : Math.random() * 2 + 2.5,
      speed: near ? Math.random() * 0.6 + 0.9 : Math.random() * 0.5 + 0.35,
      phase: Math.random() * Math.PI * 2,
      sway: Math.random() * 0.5 + 0.2,
      alpha: near ? 0.8 : Math.random() * 0.35 + 0.5
    });
  }
}
function drawSnow() {
  ctx.save();
  for (const f of flakes) {
    ctx.globalAlpha = f.alpha;
    ctx.drawImage(flakeSprite, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    f.phase += 0.015;
    f.y += f.speed;
    f.x += Math.sin(f.phase) * f.sway;
    if (f.y > canvas.height + 8) { f.y = -8; f.x = Math.random() * canvas.width; }
  }
  ctx.restore();
}

// ---------- santa hat, cropped tight to its own artwork ----------
const HAT_ASPECT = 600 / 510;
const HAT_SCALE = 0.78;   // hat width relative to the detected face; lower = smaller
const HAT_LIFT = 0.74;    // how high it sits above the face box; lower = lower on the head

function drawHat(box, green) {
  if (!hatReady) return;
  const img = (green && hatGreen) ? hatGreen : hatImg;
  const w = box.width * HAT_SCALE;
  const h = w / HAT_ASPECT;
  const cx = box.x + box.width / 2;
  const topY = box.y - h * HAT_LIFT;
  ctx.drawImage(img, cx - w / 2, topY, w, h);
}

// ---------- ambience: warm golden bokeh lights around the edges (no frame) ----------
const bokehSprite = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,226,150,0.95)');
  g.addColorStop(0.5, 'rgba(255,200,110,0.45)');
  g.addColorStop(1, 'rgba(255,190,90,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  return c;
})();
const bokeh = [];
for (let i = 0; i < 26; i++) {
  // positions hug the top and the two sides, as a string of lights
  const edge = i % 3;
  let bx, by;
  if (edge === 0) { bx = Math.random(); by = Math.random() * 0.12; }
  else if (edge === 1) { bx = Math.random() * 0.1; by = Math.random(); }
  else { bx = 0.9 + Math.random() * 0.1; by = Math.random(); }
  bokeh.push({ bx, by, r: 0.012 + Math.random() * 0.03, ph: Math.random() * 6.28, sp: 0.01 + Math.random() * 0.02 });
}
function drawFrame() {
  const w = canvas.width, h = canvas.height;
  const base = Math.min(w, h);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of bokeh) {
    l.ph += l.sp;
    ctx.globalAlpha = 0.45 + 0.4 * Math.sin(l.ph);
    const r = l.r * base * 2.2;
    ctx.drawImage(bokehSprite, l.bx * w - r, l.by * h - r, r * 2, r * 2);
  }
  ctx.restore();
}

function randomId() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}

function drawQr(text, el) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), quiet = 3, size = 360;
  el.width = size; el.height = size;
  const q = el.getContext('2d');
  q.fillStyle = '#fff';
  q.fillRect(0, 0, size, size);
  const cell = size / (n + quiet * 2);
  q.fillStyle = '#0d1b2a';
  for (let r = 0; r < n; r++) {
    for (let col = 0; col < n; col++) {
      if (qr.isDark(r, col)) {
        q.fillRect(Math.floor((col + quiet) * cell), Math.floor((r + quiet) * cell), Math.ceil(cell), Math.ceil(cell));
      }
    }
  }
}

function showShare(state, text) {
  shareEl.dataset.state = state;

  shareEl.classList.add('show');
  clearTimeout(shareTimer);
  if (state !== 'loading') shareTimer = setTimeout(hideShare, SHARE_SHOW_MS);
}
let scanPoll = null;
function hideShare() {
  shareToken++;
  clearTimeout(shareTimer);
  clearInterval(scanPoll);
  shareEl.classList.remove('show');
}

async function startShare() {
  const pol = lastPolaroidCanvas;
  if (!pol || !SUPABASE_KEY) { setDebug('QR desactivado: falta la clave del servidor'); return; }
  const token = ++shareToken;
  showShare('loading', 'Preparando tu foto…');
  try {
    const blob = await new Promise(res => pol.toBlob(res, 'image/jpeg', 0.9));
    const id = randomId();
    const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'image/jpeg', 'x-upsert': 'false', 'cache-control': 'max-age=3600' };
    if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
    const r = await fetch(SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + id + '.jpg', { method: 'POST', headers, body: blob });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (token !== shareToken) return;       // a newer photo replaced this one
    drawQr(SHARE_PAGE + '?f=' + id, shareQr);
    showShare('ready', 'Escanea el QR con la cámara de tu móvil');
    // the landing page leaves a tiny marker file when it is opened: when it appears, hide the QR 10 s later
    clearInterval(scanPoll);
    scanPoll = setInterval(async () => {
      if (token !== shareToken) { clearInterval(scanPoll); return; }
      try {
        const m = await fetch(SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/scan-' + id + '.jpg?t=' + Date.now(), { cache: 'no-store' });
        if (m.ok && token === shareToken) {
          clearInterval(scanPoll);
          clearTimeout(shareTimer);
          shareTimer = setTimeout(hideShare, SHARE_AFTER_SCAN_MS);
        }
      } catch (e) { /* ignore, try again */ }
    }, 2000);
  } catch (err) {
    if (token !== shareToken) return;
    setDebug('Error subiendo la foto: ' + err.message);
    showShare('error', 'No hemos podido preparar el QR. Pídenos tu foto en la oficina.');
  }
}

function capturePhoto() {
  const out = document.createElement('canvas');
  out.width = canvas.width;
  out.height = canvas.height;
  const octx = out.getContext('2d');
  // video, mirrored, with the same "cover" crop the page uses
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(out.width / vw, out.height / vh);
  const dw = vw * scale, dh = vh * scale;
  octx.save();
  octx.translate(out.width, 0);
  octx.scale(-1, 1);
  octx.drawImage(video, (out.width - dw) / 2, (out.height - dh) / 2, dw, dh);
  octx.restore();
  // snow + hats + frame
  octx.drawImage(canvas, 0, 0);
  return makePolaroid(out);
}

// Christmas card: hand-painted gingham border (red / green / cream), cream panel, serif greeting, logo and date
const XM_RED = '#9B1C24';
const XM_GREEN = '#4D5D2C';
const XM_CREAM = '#F5EFE1';

function drawGingham(g, W, H, cell) {
  g.fillStyle = XM_CREAM;
  g.fillRect(0, 0, W, H);
  const cols = [XM_RED, XM_GREEN];
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = 0.72;
  const period = cell * 2;
  for (let i = 0; i * period < W; i++) {
    g.fillStyle = cols[i % 2];
    g.fillRect(i * period, 0, cell, H);
  }
  for (let j = 0; j * period < H; j++) {
    g.fillStyle = cols[(j + 1) % 2];
    g.fillRect(0, j * period, W, cell);
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}
function drawAsterisk(g, x, y, r, color) {
  g.save();
  g.strokeStyle = color;
  g.lineWidth = Math.max(1.5, r * 0.28);
  g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const a = Math.PI / 3 * i + Math.PI / 2;
    g.beginPath();
    g.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
    g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    g.stroke();
  }
  g.restore();
}
function makePolaroid(photo) {
  const pw = photo.width, ph = photo.height;
  const gm = Math.round(pw * 0.16);        // gingham margin
  const side = Math.round(pw * 0.07);      // cream margin at the sides
  const head = Math.round(pw * 0.34);      // title area
  const foot = Math.round(pw * 0.38);      // logo + date area
  const panelW = pw + side * 2;
  const panelH = head + ph + foot;
  const W = panelW + gm * 2, H = panelH + gm * 2;
  const pol = document.createElement('canvas');
  pol.width = W; pol.height = H;
  const g = pol.getContext('2d');
  drawGingham(g, W, H, Math.round(pw * 0.07));
  // cream panel with soft shadow
  g.save();
  g.shadowColor = 'rgba(40,20,10,0.25)';
  g.shadowBlur = pw * 0.03;
  g.fillStyle = XM_CREAM;
  g.fillRect(gm, gm, panelW, panelH);
  g.restore();
  // photo
  const px = gm + side, py = gm + head;
  g.drawImage(photo, px, py);
  // title
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  drawAsterisk(g, W / 2, gm + head * 0.2, pw * 0.022, XM_RED);
  const tsize = Math.round(pw * 0.088);
  g.font = '700 ' + tsize + 'px Georgia, "Times New Roman", serif';
  if ('letterSpacing' in g) g.letterSpacing = Math.round(pw * 0.004) + 'px';
  g.fillStyle = XM_GREEN;
  g.fillText('FELIZ', W / 2, gm + head * 0.55);
  g.fillStyle = XM_RED;
  g.fillText('NAVIDAD', W / 2, gm + head * 0.55 + tsize * 1.15);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  // footer: logo + date
  const lw = panelW * 0.46;
  const src = logoDark || logoImg;
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const lh = lw * sh / sw;
  const fy = gm + head + ph;
  if (sw) g.drawImage(src, (W - lw) / 2, fy + foot * 0.2, lw, lh);
  const fecha = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  g.fillStyle = XM_GREEN;
  g.font = '400 ' + Math.round(pw * 0.03) + 'px Georgia, serif';
  if ('letterSpacing' in g) g.letterSpacing = Math.round(pw * 0.005) + 'px';
  g.fillText(fecha.toUpperCase(), W / 2, fy + foot * 0.2 + lh + pw * 0.06);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  drawAsterisk(g, W / 2, fy + foot * 0.9, pw * 0.02, XM_RED);
  lastPolaroidCanvas = pol;
  return pol.toDataURL('image/png');
}

// golden sparkle burst, drawn on the live canvas after the photo is taken
let sparks = [];
const SPARK_COLORS = ['#FFD86B', '#FFF1B8', '#E8B64C', '#FFFFFF'];
function burstSparks() {
  for (let i = 0; i < 140; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 3 + Math.random() * 10;
    sparks.push({
      x: canvas.width / 2, y: canvas.height * 0.5,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
      r: 2 + Math.random() * 5,
      life: 1,
      color: SPARK_COLORS[(Math.random() * SPARK_COLORS.length) | 0],
      star: Math.random() < 0.4
    });
  }
}
function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rad = i % 2 === 0 ? r * 1.8 : r * 0.7;
    const ang = (Math.PI / 4) * i;
    ctx.lineTo(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad);
  }
  ctx.closePath();
  ctx.fill();
}
function drawSparks() {
  if (!sparks.length) return;
  ctx.save();
  for (const s of sparks) {
    ctx.globalAlpha = Math.max(s.life, 0);
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 12;
    if (s.star) drawStar(s.x, s.y, s.r); else { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.18; s.vx *= 0.985;
    s.life -= 0.011;
  }
  ctx.restore();
  sparks = sparks.filter(s => s.life > 0);
}

function savePhoto(dataUrl) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const name = 'espejo-navideno-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
               '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.png';
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function runPhotoSequence() {
  photoState = 'running';
  cancelFlag = false;
  hideShare();
  showCountdown('<span class="txt">¡Sonríe!</span>');
  await sleep(SMILE_MS);
  for (let n = COUNT_FROM; n >= 1; n--) {
    if (cancelFlag) { hideCountdown(); photoState = 'idle'; closeSince = 0; return; }
    showCountdown('<span class="big">' + n + '</span>');
    await sleep(1000);
  }
  hideCountdown();
  const dataUrl = capturePhoto();
  flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
  burstSparks();
  savePhoto(dataUrl);
  shotEl.src = dataUrl;
  shotEl.classList.add('show');
  setTimeout(() => shotEl.classList.remove('show'), 2200);
  setTimeout(startShare, 2400);
  photoState = 'cooldown';   // no new photo until the person walks away
}

function updatePhotoLogic(close) {
  const now = performance.now();
  if (close) {
    if (!closeSince) closeSince = now;
    if (photoState === 'idle' && now - closeSince > HOLD_MS) runPhotoSequence();
  } else {
    if (photoState === 'running' && awayFrames > 45) cancelFlag = true;
    if (awayFrames > 150) {
      closeSince = 0;
      if (photoState === 'cooldown') photoState = 'idle';
    }
  }
}

// ---------- render loop ----------
function startRenderLoop() {
  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawSnow();

    // one person: red hat. Several: alternate red and green, left to right
    updateTracks();
    const sorted = tracks.filter(t => t.alpha > 0.05).sort((a, b) => a.x - b.x);
    sorted.forEach((t, i) => {
      ctx.globalAlpha = Math.min(1, t.alpha);
      drawHat(t, sorted.length > 1 && i % 2 === 1);
    });
    ctx.globalAlpha = 1;

    drawFrame();
    drawSparks();

    if (isClose) {
      awayFrames = 0;
      if (!idleImg.classList.contains('hidden')) idleImg.classList.add('hidden');
    } else {
      awayFrames++;
      if (awayFrames > 150) {
        idleImg.classList.remove('hidden');
      }
    }

    updatePhotoLogic(isClose);

    requestAnimationFrame(frame);
  }
  frame();
}

// ---------- smooth tracking: hats glide to the detected faces instead of jumping ----------
let tracks = [];
function updateTracks() {
  for (const t of tracks) {
    const k = 0.08;   // slow glide: the hat feels anchored
    t.x += (t.tx - t.x) * k;
    t.y += (t.ty - t.y) * k;
    t.width += (t.tw - t.width) * k;
    t.height += (t.th - t.height) * k;
    t.alpha += (t.miss === 0 || photoState === 'running') ? 0.2 : -0.12;
    if (t.alpha > 1) t.alpha = 1;
  }
  tracks = tracks.filter(t => t.alpha > 0);
}
function feedTracks(boxes) {
  // while the smile / countdown runs, hats stay exactly where they are: people adapt to the hat
  if (photoState === 'running') return;
  const free = boxes.slice();
  for (const t of tracks) {
    let best = -1, bd = Infinity;
    free.forEach((b, i) => {
      const d = Math.hypot((b.x + b.width / 2) - (t.tx + t.tw / 2), (b.y + b.height / 2) - (t.ty + t.th / 2));
      if (d < bd) { bd = d; best = i; }
    });
    if (best >= 0 && bd < t.tw * 1.6) {
      const b = free.splice(best, 1)[0];
      // dead zone: the hat only relocates when the face really moves or changes size,
      // so small jitters and head wobble don't shake it
      const move = Math.hypot((b.x + b.width / 2) - (t.tx + t.tw / 2), (b.y + b.height / 2) - (t.ty + t.th / 2));
      const grow = Math.abs(b.width - t.tw) / t.tw;
      if (move > t.tw * 0.22 || grow > 0.2) {
        t.tx = b.x; t.ty = b.y; t.tw = b.width; t.th = b.height;
      }
      t.miss = 0;
    } else {
      t.miss++;
      if (t.miss > 5) t.alpha -= 0.1; // lost for a while: fade out
    }
  }
  for (const b of free) {
    tracks.push({ x: b.x, y: b.y, width: b.width, height: b.height,
                  tx: b.x, ty: b.y, tw: b.width, th: b.height, miss: 0, alpha: 0 });
  }
}

// ---------- detection loop: detects ALL faces, so two people both get a hat ----------
async function startDetectionLoop() {
  try {
    setDebug('Cargando modelo facial…');
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    setDebug('Modelo cargado. Detectando…');
  } catch (err) {
    setDebug('No se pudo cargar el modelo facial: ' + err.message);
    return;
  }

  const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.35 });

  async function tick() {
    try {
      const results = await faceapi.detectAllFaces(video, options);
      const vw = video.videoWidth || canvas.width;
      const vh = video.videoHeight || canvas.height;
      // the video is shown with object-fit: cover, so map with the same crop
      const scale = Math.max(canvas.width / vw, canvas.height / vh);
      const offX = (canvas.width - vw * scale) / 2;
      const offY = (canvas.height - vh * scale) / 2;

      const boxes = results.map(r => {
        const b = r.box;
        const w = b.width * scale;
        const xr = offX + b.x * scale;
        return {
          x: canvas.width - (xr + w),   // mirrored
          y: offY + b.y * scale,
          width: w,
          height: b.height * scale
        };
      });
      // drop tiny false positives and overlapping duplicates (keep the larger box)
      boxes.sort((a, b) => b.width - a.width);
      const clean = [];
      for (const b of boxes) {
        if (b.width < canvas.width * 0.05) continue;
        const dup = clean.some(c => {
          const ix = Math.max(0, Math.min(b.x + b.width, c.x + c.width) - Math.max(b.x, c.x));
          const iy = Math.max(0, Math.min(b.y + b.height, c.y + c.height) - Math.max(b.y, c.y));
          const inter = ix * iy;
          return inter / Math.min(b.width * b.height, c.width * c.height) > 0.45;
        });
        if (!dup) clean.push(b);
      }
      boxes.length = 0;
      clean.forEach(b => boxes.push(b));
      feedTracks(boxes);

      currentFaceBoxes = boxes;
      isClose = boxes.some(b => (b.width / canvas.width) > CLOSE_WIDTH_RATIO);
      setDebug(boxes.length + ' cara(s) detectada(s)' + (isClose ? ' · cerca' : ''));
    } catch (err) {
      setDebug('Error detectando: ' + err.message);
    }
    setTimeout(tick, 30);
  }
  tick();
}

// ---------- camera activation ----------
async function activateMirror() {
  try {
    setDebug('Pidiendo permiso de cámara…');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    startGate.style.display = 'none';

    await video.play();
    resizeCanvas();
    initSnow();

    startRenderLoop();
    startDetectionLoop();
  } catch (err) {
    startGate.style.display = 'flex';
    startGate.querySelector('small').textContent =
      'No se pudo acceder a la cámara: ' + err.message;
    setDebug('Error de cámara: ' + err.message);
  }
}

window.addEventListener('load', () => {
  activateMirror();
});
startGate.addEventListener('click', activateMirror);
</script>
